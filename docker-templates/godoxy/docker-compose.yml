x-arcane:
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/godoxy.webp
  urls:
    - https://github.com/yusing/godoxy
    - https://tinyauth.app/docs/getting-started/

services:
  socket-proxy:
    container_name: socket-proxy
    image: ghcr.io/yusing/socket-proxy:latest
    env_file: .env
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    restart: unless-stopped
    tmpfs:
      - /run
    ports:
      - ${LISTEN_ADDR:-127.0.0.1:2375}:2375
      
  app:
    image: ghcr.io/yusing/godoxy:${TAG:-latest}
    container_name: godoxy-proxy
    env_file: .env
    restart: always
    network_mode: host # do not change this
    user: ${GODOXY_UID:-1000}:${GODOXY_GID:-1000}
    depends_on:
      socket-proxy:
        condition: service_started
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - all
    cap_add:
      - NET_BIND_SERVICE
    # The WebUI is served from embedded assets by GoDoxy itself.
    # Configure its hostnames with `webui.aliases` in config/config.yml.
    volumes:
      - ./godoxy-data/config:/app/config
      - ./godoxy-data/logs:/app/logs
      - ./godoxy-data/error_pages:/app/error_pages:ro
      - ./godoxy-data:/app/data
      # This path stores certs obtained from autocert and agent TLS client certs
      - ./godoxy-data/certs:/app/certs

      # mount existing certificate
      # - /path/to/certs/cert.crt:/app/certs/cert.crt
      # - /path/to/certs/priv.key:/app/certs/priv.key
    labels:
      com.getarcaneapp.arcane.icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/webp/godoxy.webp
      
  tinyauth:
    image: ghcr.io/tinyauthapp/tinyauth:latest
    container_name: tinyauth
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./auth/users:/data/users
    labels:
      com.getarcaneapp.arcane.icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/tinyauth.svg
      proxy.aliases: auth
      proxy.auth.port: 3000
