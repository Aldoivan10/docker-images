name: Check base image & rebuild variants

on:
    schedule:
        - cron: '0 4 * * *'   # todos los días a las 4:00 UTC
    workflow_dispatch:        # permite lanzarlo a mano desde la pestaña "Actions"

jobs:
    check-and-build:
        runs-on: ubuntu-latest
        strategy:
        fail-fast: false     # si falla una variante, las demás siguen igualmente
        matrix:
            include:
            - name: node
                base_image: codercom/code-server:latest
                context: ./development/Dockerfile.node
                image: ghcr.io/Aldoivan10/node:latest
                webhook_secret: ARCANE_WEBHOOK_NODE
            #- name: python
            #    base_image: codercom/code-server:latest
            #    context: ./development/Dockerfile.python
            #    image: ghcr.io/Aldoivan10/python:latest
            #    webhook_secret: ARCANE_WEBHOOK_PYTHON
            #- name: otra-imagen        # <- ejemplo con una base totalmente distinta
            #    base_image: nginx:latest
            #    context: ./development/Dockerfile.otra
            #    image: ghcr.io/Aldoivan10/otra-imagen:latest
            #    webhook_secret: ARCANE_WEBHOOK_OTRA

        steps:
        - name: Checkout repo
            uses: actions/checkout@v4

        - name: Check if base image changed
            id: check
            uses: lucacome/docker-image-update-checker@v1
            with:
            base-image: ${{ matrix.base_image }}
            image: ${{ matrix.image }}

        - name: Log in to GHCR
            if: steps.check.outputs.needs-updating == 'true'
            uses: docker/login-action@v3
            with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Set up Docker Buildx
            if: steps.check.outputs.needs-updating == 'true'
            uses: docker/setup-buildx-action@v3

        - name: Build and push (${{ matrix.name }})
            if: steps.check.outputs.needs-updating == 'true'
            uses: docker/build-push-action@v5
            with:
            context: ${{ matrix.context }}
            push: true
            tags: ${{ matrix.image }}

        - name: Trigger Arcane redeploy (${{ matrix.name }})
            if: steps.check.outputs.needs-updating == 'true'
            run: |
            curl -fsS -X POST "${{ secrets.ARCANE_URL }}/api/projects/${{ matrix.arcane_project_id }}/redeploy" \
                -H "Authorization: Bearer ${{ secrets.ARCANE_API_KEY }}" \
                -H "Content-Type: application/json"
