name: Check base image & rebuild variants

on:
  schedule:
    - cron: '0 4 * * *'   # todos los días a las 4:00 UTC
  workflow_dispatch:        # permite lanzarlo a mano desde la pestaña "Actions"

permissions:
  contents: read
  packages: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false     # si falla una variante, las demás siguen igualmente
      matrix:
        include:
          - name: node
            base_image: codercom/code-server:latest
            context: ./development
            dockerfile: Dockerfile.node
            image: ghcr.io/Aldoivan10/node:latest
            arcane_project_id: TU_PROJECT_ID_NODE
          # - name: python
          #   base_image: codercom/code-server:latest
          #   context: ./development
          #   dockerfile: Dockerfile.python
          #   image: ghcr.io/Aldoivan10/python:latest
          #   arcane_project_id: TU_PROJECT_ID_PYTHON
          # - name: otra-imagen
          #   base_image: nginx:latest
          #   context: ./development
          #   dockerfile: Dockerfile.otra
          #   image: ghcr.io/Aldoivan10/otra-imagen:latest
          #   arcane_project_id: TU_PROJECT_ID_OTRA

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check if base image changed
        id: check
        continue-on-error: true
        uses: lucacome/docker-image-update-checker@v1
        with:
          base-image: ${{ matrix.base_image }}
          image: ${{ matrix.image }}

      - name: Log in to GHCR
        if: steps.check.outputs.needs-updating == 'true' || steps.check.outcome == 'failure'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check.outputs.needs-updating == 'true' || steps.check.outcome == 'failure'
        uses: docker/setup-buildx-action@v3

      - name: Build and push (${{ matrix.name }})
        if: steps.check.outputs.needs-updating == 'true' || steps.check.outcome == 'failure'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ matrix.image }}

      - name: Trigger Arcane redeploy (${{ matrix.name }})
        if: steps.check.outputs.needs-updating == 'true' || steps.check.outcome == 'failure'
        run: |
          curl -fsS -X POST "${{ secrets.ARCANE_URL }}/api/projects/${{ matrix.arcane_project_id }}/redeploy" \
            -H "Authorization: Bearer ${{ secrets.ARCANE_API_KEY }}" \
            -H "Content-Type: application/json"
